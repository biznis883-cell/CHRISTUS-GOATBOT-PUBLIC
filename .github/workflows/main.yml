
name: Goat Bot V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start bot
        run: npm start
